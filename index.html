<style>
/* ===== STYLE ===== */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body {
    font-family: 'Poppins', sans-serif;

    /* BACKGROUND GAMBAR RESPONSIVE */
    background-image: url("back.png");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: cover; /* menjaga proporsional dan menutupi seluruh layar */
    min-height: 100vh;

    /* Overlay gelap */
    position: relative;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 20px;
}

/* Overlay gelap tetap */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: -1;
}

/* Media Queries untuk mobile */
@media (max-width: 768px) {
    body {
        background-position: top center;
        background-size: cover; /* tetap proporsional */
        padding: 10px;
    }

    h2 {
        font-size: 20px;
    }

    input, button, select {
        width: 95%;
        font-size: 14px;
    }

    #totalData {
        font-size: 60px;
    }
}

@media (max-width: 480px) {
    body {
        background-position: center top;
        background-size: cover;
    }

    h2 {
        font-size: 18px;
    }

    #totalData {
        font-size: 50px;
    }

    input, button, select {
        width: 100%;
        font-size: 13px;
        padding: 10px;
    }
}
h2{font-size:24px; font-weight:700; color:#ff7a00; margin-bottom:20px; text-shadow:0 0 15px rgba(255,122,0,0.5);}
h3{margin-top:25px; margin-bottom:10px; font-weight:600; color:#ff9500;}
body > *{width:100%; max-width:450px; margin-bottom:15px; backdrop-filter: none; background: rgba(255,255,255,0.05); border-radius:20px; padding:15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition:0.3s;}
#totalData{font-size:80px; font-weight:700; color:#ff7a00; text-shadow:0 0 25px rgba(255,122,0,0.8);}
input, button, select{width:90%; max-width:400px; padding:12px; margin:8px auto; border-radius:15px; border:none; font-size:15px; outline:none; display:block; text-align:center;}

input:focus{background: rgba(255,255,255,0.25);}
button{background: linear-gradient(45deg,#ff7a00,#ff9500); color:white; font-weight:600; cursor:pointer; box-shadow:0 5px 20px rgba(255,122,0,0.4); transition:0.3s;}
button:hover{transform: scale(1.05); box-shadow:0 8px 25px rgba(255,122,0,0.6);}
.success, .error{padding:12px; border-radius:15px; width:100%; margin:10px 0; font-weight:600; backdrop-filter: blur(10px); transition:0.3s;}

.error{background: rgba(132,32,41,0.7); color:#ffb6b6; box-shadow:0 5px 15px rgba(255,0,0,0.3);}
#reader{width:100%; max-width:350px; margin:15px auto; border-radius:20px; overflow:hidden; box-shadow:0 15px 35px rgba(0,0,0,0.6); border:2px solid rgba(255,255,255,0.2);}
table{width:100%; border-collapse:collapse; background: rgba(255,255,255,0.05); border-radius:20px; overflow:hidden; box-shadow:0 10px 25px rgba(0,0,0,0.5);}
th{background: rgba(20,40,80,0.8); color:white; padding:12px;}
td{padding:10px; border-bottom:1px solid rgba(255,255,255,0.1); text-align:center;}
tr:hover{background: rgba(255,255,255,0.1);}
.tab-buttons {display:flex; justify-content:center; margin-bottom:15px;}
.tab-btn {flex:1; padding:10px; margin:0 5px; border:none; border-radius:15px; background: rgba(255,255,255,0.1); color:white; font-weight:600; cursor:pointer; transition:0.3s;}
.tab-btn.active {background: linear-gradient(45deg,#ff7a00,#ff9500); box-shadow:0 5px 20px rgba(255,122,0,0.4);}
.tab-btn:hover {transform: scale(1.05);}
.tab-content {margin-top:10px; display:none;}
#userInfo {padding:10px; border-radius:15px; text-align:center; font-weight:600; margin-bottom:15px;}
#userInfo.admin { background: rgba(255,122,0,0.2); color: #ff7a00; }

#userInfo.user { background: rgba(0,200,150,0.2); color: #00c896; }
#userInfo button {font-weight:600; cursor:pointer; transition:0.3s; margin-left:5px;}
#userInfo button:hover {transform: scale(1.05);}

/* ===== Sembunyikan elemen setelah login di halaman pertama ===== */
#totalData,
#filterKantong,
#reader,
table,
h3:nth-of-type(2),
h3:nth-of-type(3),
h3:nth-of-type(4)
{
    display: none;
}

#sectionTotal,
#sectionFilter {
    display: none;
}

/* Tombol logout rata tengah */
#userInfo {
    text-align: center;
}

#userInfo button {
    display: inline-block;
    margin: 8px 5px 0 5px;
}

/* ===== EFEK SHAKE ERROR ===== */
/* ===== SHAKE KUAT KHUSUS ERROR BEA CUKAI ===== */
@keyframes strongShake {
  0% { transform: translateX(0) rotate(0); }
  10% { transform: translateX(-15px) rotate(-3deg); }
  20% { transform: translateX(15px) rotate(3deg); }
  30% { transform: translateX(-15px) rotate(-3deg); }
  40% { transform: translateX(15px) rotate(3deg); }
  50% { transform: translateX(-10px) rotate(-2deg); }
  60% { transform: translateX(10px) rotate(2deg); }
  70% { transform: translateX(-8px) rotate(-1deg); }
  80% { transform: translateX(8px) rotate(1deg); }
  90% { transform: translateX(-4px); }
  100% { transform: translateX(0); }
}

.strong-shake {
  animation: strongShake 0.7s ease;
}

/* ===== FLASH ORANGE WARNING ===== */
@keyframes flashOrange {
  0% { background-color: rgba(255,140,0,0); }
  50% { background-color: rgba(255,140,0,0.6); }
  100% { background-color: rgba(255,140,0,0); }
}

.flash-orange {
  animation: flashOrange 0.6s ease 2;
}

/* ===== SHAKE SUPER KUAT ===== */
@keyframes brutalShake {
  0% { transform: translate(0,0) rotate(0); }
  10% { transform: translate(-20px,10px) rotate(-5deg); }
  20% { transform: translate(20px,-10px) rotate(5deg); }
  30% { transform: translate(-25px,15px) rotate(-6deg); }
  40% { transform: translate(25px,-15px) rotate(6deg); }
  50% { transform: translate(-15px,10px) rotate(-4deg); }
  60% { transform: translate(15px,-10px) rotate(4deg); }
  70% { transform: translate(-10px,5px) rotate(-3deg); }
  80% { transform: translate(10px,-5px) rotate(3deg); }
  90% { transform: translate(-5px,2px); }
  100% { transform: translate(0,0); }
}

.brutal-shake {
  animation: brutalShake 0.8s ease;
}

/* ===== GLITCH ORANGE WARNING ===== */
@keyframes glitchOrange {
  0% { text-shadow: 2px 2px #ff7a00, -2px -2px #ffd700; }
  25% { text-shadow: -2px -2px #ff9500, 2px 2px #ffaa00; }
  50% { text-shadow: 2px -2px #ff7a00, -2px 2px #ffcc00; }
  75% { text-shadow: -2px 2px #ff9500, 2px -2px #ffaa00; }
  100% { text-shadow: 2px 2px #ff7a00, -2px -2px #ffd700; }
}

.glitch-orange {
  animation: glitchOrange 0.25s infinite;
}

/* ===== STYLE DROPDOWN JUDUL LEBIH TEBAL & KEREN ===== */
#filterKantong {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: linear-gradient(45deg,#ff7a00,#ff9500);

    box-shadow: 0 5px 20px rgba(255,122,0,0.5);
}

/* Style option dropdown */
#filterKantong option {

    font-size: 15px;
    background: #142850;

}

/* ===== STYLE KHUSUS UNTUK SEMUA DATA KANTONG ===== */
#filterKantong option[value="all"] {

    font-size: 16px;
    color: #ffffff;
    background: linear-gradient(45deg,#ff7a00,#ff9500);
}

/* =============================== */
/* ===== NEON CYBER STYLE ======== */
/* =============================== */

.neon-upload {
    display: inline-block;
    padding: 14px 25px;
    margin: 10px auto;
    border-radius: 20px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    color: #00f7ff;
    border: 2px solid #00f7ff;
    background: transparent;
    transition: 0.3s;
    box-shadow: 0 0 10px #00f7ff,
                0 0 20px #00f7ff,
                0 0 40px rgba(0,247,255,0.6);
    overflow: hidden;
}

/* Glow Animation */
@keyframes neonGlow {
    0% { box-shadow: 0 0 10px #00f7ff, 0 0 20px #00f7ff; }
    50% { box-shadow: 0 0 20px #00f7ff, 0 0 40px #00f7ff; }
    100% { box-shadow: 0 0 10px #00f7ff, 0 0 20px #00f7ff; }
}

.neon-upload {
    animation: neonGlow 1.5s infinite alternate;
}

/* Hover Effect */
.neon-upload:hover {
    background: #00f7ff;
    color: #0f1f3d;
    transform: scale(1.07);
}

/* UPLOAD BUTTON CYBER */
.neon-upload-btn {
    display: inline-block;
    padding: 14px 25px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border: 2px solid #ff00ff;
    background: transparent;
    color: #ff00ff;
    transition: 0.3s;
    box-shadow: 0 0 10px #ff00ff,
                0 0 25px #ff00ff,
                0 0 50px rgba(255,0,255,0.7);
}

/* Glow Pulse */
@keyframes pulsePink {
    0% { box-shadow: 0 0 10px #ff00ff; }
    50% { box-shadow: 0 0 40px #ff00ff; }
    100% { box-shadow: 0 0 10px #ff00ff; }
}

.neon-upload-btn {
    animation: pulsePink 1.8s infinite;
}

.neon-upload-btn:hover {
    background: #ff00ff;
    color: #0f1f3d;
    transform: scale(1.07);
}

.neon-exit-btn:hover {

.neon-exit-btn {
    display: inline-block;

/* Glow pulse animation */
@keyframes pulseExitOrange {

.neon-exit-btn {

}

/* ===== SHAKE MERAH SUPER KUAT ===== */
@keyframes megaShakeRed {
  0% { transform: translate(0,0); }
  10% { transform: translate(-25px,15px); }
  20% { transform: translate(25px,-15px); }
  30% { transform: translate(-30px,20px); }
  40% { transform: translate(30px,-20px); }
  50% { transform: translate(-20px,15px); }
  60% { transform: translate(20px,-15px); }
  70% { transform: translate(-15px,10px); }
  80% { transform: translate(15px,-10px); }
  90% { transform: translate(-8px,5px); }
  100% { transform: translate(0,0); }
}

.mega-shake-red {

}

function ambilStatus(item){

    var mode = sessionStorage.getItem("mode");

    // Jika data lama (boolean true)
    if(typeof item !== "object" || item === null){
        return "OK KANTONG DI TERIMA";
    }

    // Jika mode Win2
    if(mode === "readonly"){
        return (item.status_win2 && item.status_win2 !== "")
            ? item.status_win2
            : "-";
    }

    // Mode normal
    return (item.status && item.status !== "")
        ? item.status
        : "OK KANTONG DI TERIMA";
}

// Selain Win2 tetap wajib pilih judul

    return;
}

    db.child(judulDipilih).child(decodedText).once("value", snap=>{

    var item = snap.val();

   if(item){

    var statusText = ambilStatus(item);
    var mode = sessionStorage.getItem("mode");

    tampilkanStatusScan(decodedText, statusText);

}   else {


            beepError.play();
            shakeScreen();

function filterList(){

// 🔥 KHUSUS WIN2

    if(filter === "all"){
        document.querySelector("table").style.display = "none";
        document.querySelectorAll("h3")[4].style.display = "none";
    } else {
        document.querySelector("table").style.display = "table";
        document.querySelectorAll("h3")[4].style.display = "block";
    }
}
else if(mode === "normal"){ 
    // 🟢 WIN1
    if(filter === "all"){
        document.querySelector("table").style.display = "none";
        document.querySelectorAll("h3")[4].style.display = "none";
    } else {
        document.querySelector("table").style.display = "table";
        document.querySelectorAll("h3")[4].style.display = "block";
    }
}
    var list = document.getElementById("listKantong");

    if(window.currentRef){
        window.currentRef.off();
    }

    list.innerHTML = "";
    document.getElementById("totalData").innerText = "0";

    var ref = (filter === "all") ? db : db.child(filter);
    window.currentRef = ref;

    // ===== HITUNG TOTAL AWAL =====
    ref.once("value", function(snapshot){

        var total = 0;

        if(filter === "all"){
            snapshot.forEach(function(judulSnap){
                judulSnap.forEach(function(child){
                    total++;
                });
            });
        } else {
            snapshot.forEach(function(child){
                total++;
            });
        }

        document.getElementById("totalData").innerText = total;
    });

    // ===== REALTIME LIST =====
    ref.on("child_added", function(snap){

        if(filter === "all"){

            var judul = snap.key;

            snap.forEach(child=>{
                var kode = child.key;

                var row = document.createElement("tr");
                row.innerHTML = "<td>"+kode+"</td><td>"+judul+"</td>";
                list.appendChild(row);

        } else {

            var kode = snap.key;

            var row = document.createElement("tr");
            row.innerHTML = "<td>"+kode+"</td><td>"+filter+"</td>";
            list.appendChild(row);
        }
    });

    ref.on("child_removed", function(){
        filterList();
    });

    var role = sessionStorage.getItem("role");
var mode = sessionStorage.getItem("mode");

dbRoot.once("value", function(snap){

function loadDropdownJudul(data){

    var dropdown = document.getElementById("filterKantong");
    var hapusDropdown = document.getElementById("hapusJudulDropdown");

    var current = dropdown.value;

    dropdown.innerHTML = "<option value='all'>SEMUA DATA KANTONG</option>";
    hapusDropdown.innerHTML = "<option value=''>PILIH JUDUL</option>";

    if(data){
        for(var judul in data){

            dropdown.innerHTML += "<option value='"+judul+"'>"+judul+"</option>";
            hapusDropdown.innerHTML += "<option value='"+judul+"'>"+judul+"</option>";

        }
    }

    dropdown.value = current;
}

function bersihkanJudulKosong(){
    db.once("value", snap=>{
        var data = snap.val();
        if(data){
            for(var judul in data){
                if(!data[judul] || Object.keys(data[judul]).length === 0){
                    db.child(judul).remove();
                }
            }
        }
    });
}

function exportPerJudul(){
    var filter = document.getElementById("filterKantong").value;
    if(filter === "all"){
        alert("Pilih judul dulu!");
        return;
    }

    db.child(filter).once("value", snap=>{
        var data = snap.val();
        if(!data){
            alert("Tidak ada data!");
            return;
        }

        var rows = [];
        for(var kode in data){
            rows.push([kode]);
        }

        var ws = XLSX.utils.aoa_to_sheet(rows);
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, filter);
        XLSX.writeFile(wb, filter + ".xlsx");
    });
}

	else if(target === "win3"){

function normalizeStatus(text){
    if(!text) return "";

    return text
        .toString()
        .replace(/\s+/g," ")
        .replace(/\n/g,"")
        .replace(/\r/g,"")
        .trim()
        .toUpperCase();
}

function tampilkanStatusScan(kode, statusText){

    var mode = sessionStorage.getItem("mode");
    var isWin2 = (mode === "readonly");

    var statusFix = normalizeStatus(statusText);

    var htmlOutput = "<div style='margin-top:15px;'>";

    htmlOutput += "<div style='font-weight:900;font-size:" + 
              (isWin2 ? "35px" : "18px") + 
              ";margin-bottom:15px;'>"  
                  + kode + "</div>";

    if(statusFix === "OK KANTONG DI TERIMA"){

        htmlOutput += 
        "<span class='success'>✅ OK KANTONG SUDAH DI TERIMA</span>";

        beepSuccess.play();
    }

    else if(statusFix.includes("TOLAK BEA CUKAI")){

        htmlOutput += 
        "<span class='orange-error'>⚠️ ERROR KANTONG DI TOLAK BEA CUKAI</span>";

        beepBeaCukai.play();

        document.body.classList.add("mega-shake-red");

        setTimeout(function(){
            document.body.classList.remove("mega-shake-red");
        }, 5000);
    }

    else if(statusFix === "TIDAK ADA"){

        htmlOutput += 
        "<span class='error'>❌ KANTONG TIDAK TERDAFTAR</span>";

        beepError.play();
        shakeScreen();
    }

    else{

        htmlOutput += 
        "<span class='success'>ℹ️ " + statusText + "</span>";

        beepSuccess.play();
    }

    htmlOutput += "</div>";

    document.getElementById("status").innerHTML = htmlOutput;
}



function tampilkanInfoJudul(judul){

    var box = document.getElementById("infoJudulBox");
    var text = document.getElementById("infoJudulText");

    if(judul === "all"){
        box.style.display = "none";
        text.innerText = "-";
        return;
    }

    db.child(judul).once("value", function(snapshot){

        var data = snapshot.val();
        var info = "-";

        if(data){
            for(var kode in data){
                if(data[kode].infoJudul){
                    info = data[kode].infoJudul;
                    break; // cukup ambil 1 saja
                }
            }
        }

        text.innerText = info;
        box.style.display = "block";
    });
}

        return false;
    }

    // CTRL + SHIFT + I
    if(e.ctrlKey && e.shiftKey && e.keyCode == 73){
        return false;
    }

    // CTRL + SHIFT + J
    if(e.ctrlKey && e.shiftKey && e.keyCode == 74){
        return false;
    }

    // CTRL + U
    if(e.ctrlKey && e.keyCode == 85){
        return false;
    }

    // CTRL + SHIFT + C
    if(e.ctrlKey && e.shiftKey && e.keyCode == 67){
        return false;
    }

};
